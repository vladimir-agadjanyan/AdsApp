services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: adsapp_app

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql

  nginx:
    image: nginx:1.28-alpine

    container_name: adsapp_nginx

    ports:
      - "80:80"

    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app
  mysql:
    image: mysql:8.4

    container_name: adsapp_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: adsapp
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: adsapp
      MYSQL_PASSWORD: secret

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin:5-apache

    container_name: adsapp_phpmyadmin

    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root

    depends_on:
      - mysql
volumes:
  mysql_data: